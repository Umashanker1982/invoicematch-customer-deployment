# Internal load balancer: the only way users reach the application.
# In the customer's cloud this is an internal load balancer behind company SSO.
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64k;
    add_header X-Served-By "silverbrook-internal-ingress" always;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
