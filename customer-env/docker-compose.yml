# Simulated Silverbrook Financial customer environment for InvoiceMatch.
#
#   users ──► ingress (internal load balancer) ──► app ──► vault        (all inside "private")
#                                                   └──► egress-proxy ──► api.sharedllm.com only
#
# "private" is an internal network: containers on it have NO route to the internet.
# Only the egress proxy also sits on "egress", and it allows one host.

name: silverbrook

networks:
  private:
    internal: true        # the customer VPC's private subnets
  dmz:                    # where staff reach the internal load balancer
  egress:                 # the controlled exit to the internet

volumes:
  app-creds:              # AppRole credentials, written by vault-init, read-only for the app

services:
  vault:
    image: hashicorp/vault:1.17
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:?Set VAULT_ROOT_TOKEN (see .env.example)}
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add: [IPC_LOCK]
    networks: [private]   # no published port: Vault is not reachable from outside
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 3s
      timeout: 3s
      retries: 30

  vault-init:
    image: hashicorp/vault:1.17
    entrypoint: ["/bin/sh", "/init/init.sh"]
    user: "0"             # only to set file ownership on the credentials volume
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN}
      SEED_SHAREDLLM_KEY: ${SEED_SHAREDLLM_KEY:-}
    volumes:
      - ./vault:/init:ro
      - app-creds:/creds
    networks: [private]
    depends_on:
      vault: {condition: service_healthy}
    restart: "no"

  egress-proxy:
    build: ./egress-proxy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [private, egress]

  app:
    build: ../app-src     # the InvoiceMatch image, fetched at a pinned commit (scripts/fetch_app.sh)
    image: invoicematch:customer
    entrypoint: ["python", "/deploy/vault_entrypoint.py"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_SECRET_PATH: secret/data/invoicematch/llm
      HTTPS_PROXY: http://egress-proxy:3128
      HTTP_PROXY: http://egress-proxy:3128
      NO_PROXY: vault,localhost,127.0.0.1
      LLM_MODE: claude
      CLAUDE_MODEL: claude-haiku-5-5
      LLM_BASE_URL: https://api.sharedllm.com/anthropic
      DEMO_AUTHOR: Umashanker
      # No SHAREDLLM_KEY here on purpose: it is read from Vault at start-up.
    volumes:
      - ./app/vault_entrypoint.py:/deploy/vault_entrypoint.py:ro
      - app-creds:/vault/creds:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [private]   # no internet: AI calls must go through the egress proxy
    depends_on:
      vault-init: {condition: service_completed_successfully}
      egress-proxy: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 40

  ingress:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8080:8080"]   # the only published port
    volumes:
      - ./ingress/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [dmz, private]
    depends_on:
      app: {condition: service_healthy}
